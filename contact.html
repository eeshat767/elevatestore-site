<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | elevate store</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header"><div class="container header-inner"><a class="brand-mark" href="index.html"><span>elevate store</span></a><nav class="main-nav"><a href="index.html">Home</a><a href="products.html">Shop</a></nav><div class="header-actions"><a class="icon-button" href="cart.html"><span>👜</span><span class="count-bubble cart-count">0</span></a></div></div></header>
    <main class="container section-tight contact-grid">
      <div class="contact-card">
        <span class="eyebrow">Contact us</span>
        <h2 style="margin:0 0 18px; font-size:2.6rem;">We’d love to hear from you.</h2>
        <form>
          <div class="form-grid">
            <div class="form-field"><label>Name</label><input type="text" placeholder="Your name" /></div>
            <div class="form-field"><label>Email</label><input type="email" placeholder="Email" /></div>
            <div class="form-field full"><label>Subject</label><input type="text" placeholder="Subject" /></div>
            <div class="form-field full"><label>Message</label><textarea placeholder="How can we help?"></textarea></div>
          </div>
          <button class="btn btn-primary" type="submit" style="margin-top:18px;">Send message</button>
        </form>
      </div>
      <div class="contact-card contact-visual-card">
        <img class="contact-visual" src="https://images.unsplash.com/photo-1543508282-6319a3e2621f?auto=format&fit=crop&w=1200&q=80" alt="Premium sneakers and footwear styling" />
        <h3>Style that moves</h3>
        <p class="muted">From everyday essentials to statement silhouettes, our team is here to help you find the right pair for your pace.</p>
        <div class="contact-list">
          <div><strong>Email</strong><span>hello@elevatestore.com</span></div>
          <div><strong>Phone</strong><span>+234 803 000 0000</span></div>
          <div><strong>Hours</strong><span>Mon–Sat / 9am–6pm</span></div>
        </div>
      </div>
    </main>
    <footer class="site-footer"><div class="container footer-bottom"><div class="footer-copy">© 2026 elevate store</div></div></footer>
    <script src="scripts.js"></script>
  </body>
</html>
