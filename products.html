<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products — elevate store</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand-mark" href="index.html"><span>elevate store</span></a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="products.html" class="active">Shop</a>
          <a href="men.html">Men</a>
          <a href="women.html">Women</a>
          <a href="new-arrivals.html">New Arrivals</a>
        </nav>
        <div class="header-actions">
          <button class="icon-button mobile-hidden" data-search-open aria-label="Search products"><span>⌕</span></button>
          <a class="icon-button" href="cart.html" aria-label="Cart"><span>👜</span><span class="count-bubble cart-count">0</span></a>
        </div>
      </div>
    </header>

    <main class="container section-tight">
      <section class="page-hero">
        <div class="page-hero-inner">
          <span class="eyebrow">Curated collection</span>
          <h1>Shop the latest drops.</h1>
          <p>Premium footwear for every pace, from city movement to elevated evening wear.</p>
        </div>
      </section>
      <section class="product-grid" id="product-list"></section>
    </main>

    <footer></footer>
    <script src="scripts.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        renderProductsList('#product-list');
      });
    </script>
  </body>
</html>
