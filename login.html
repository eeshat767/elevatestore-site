<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | elevate store</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner"><a class="brand-mark" href="index.html"><span>elevate store</span></a><nav class="main-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="products.html">Shop</a></nav><div class="header-actions"><a class="icon-button" href="cart.html" aria-label="Cart"><span>👜</span><span class="count-bubble cart-count">0</span></a></div></div>
    </header>
    <main class="container auth-wrap">
      <div class="auth-visual"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1200&q=80" alt="Premium sneaker pair on display" /><div class="auth-overlay"><h2>Move beautifully.</h2></div></div>
      <div class="auth-panel">
        <div class="auth-box">
          <span class="eyebrow">Welcome back</span>
          <h2>Sign in</h2>
          <p>Access your order history, wishlist and account details.</p>
          <form>
            <div class="form-field"><label>Email</label><input type="email" placeholder="you@example.com" /></div>
            <div class="form-field"><label>Password</label><input type="password" placeholder="••••••••" /></div>
            <div class="inline-row"><label class="checkbox"><input type="checkbox" checked /> Remember me</label><a class="meta-link" href="register.html">Forgot password?</a></div>
            <button class="btn btn-primary" type="submit" style="width:100%;">Login</button>
            <p style="margin-top:18px; text-align:center;">New here? <a class="meta-link" href="register.html">Create account</a></p>
          </form>
        </div>
      </div>
    </main>
    <script src="scripts.js"></script>
  </body>
</html>
