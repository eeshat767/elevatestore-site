<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register | elevate store</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner"><a class="brand-mark" href="index.html"><span>elevate store</span></a><nav class="main-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="products.html">Shop</a></nav><div class="header-actions"><a class="icon-button" href="cart.html" aria-label="Cart"><span>👜</span><span class="count-bubble cart-count">0</span></a></div></div>
    </header>
    <main class="container auth-wrap">
      <div class="auth-visual"><img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?auto=format&fit=crop&w=1200&q=80" alt="Formal footwear lifestyle" /><div class="auth-overlay"><h2>Build your wardrobe.</h2></div></div>
      <div class="auth-panel">
        <div class="auth-box">
          <span class="eyebrow">Create account</span>
          <h2>Register</h2>
          <p>Sign up for early access, new arrivals and special offers.</p>
          <form>
            <div class="form-grid">
              <div class="form-field"><label>First name</label><input type="text" placeholder="First name" /></div>
              <div class="form-field"><label>Last name</label><input type="text" placeholder="Last name" /></div>
              <div class="form-field full"><label>Email</label><input type="email" placeholder="you@example.com" /></div>
              <div class="form-field full"><label>Password</label><input type="password" placeholder="Create a password" /></div>
              <div class="form-field full"><label>Confirm password</label><input type="password" placeholder="Confirm password" /></div>
            </div>
            <label class="checkbox" style="margin: 18px 0;"><input type="checkbox" /> I agree to the terms and privacy policy.</label>
            <button class="btn btn-primary" type="submit" style="width:100%;">Create account</button>
            <p style="margin-top:18px; text-align:center;">Already have an account? <a class="meta-link" href="login.html">Login</a></p>
          </form>
        </div>
      </div>
    </main>
    <script src="scripts.js"></script>
  </body>
</html>
