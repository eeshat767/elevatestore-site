<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Upload Product</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><div class="container header-row"><a class="brand" href="index.html">elevatestore</a><nav class="main-nav"><a href="products.html">Products</a><a href="admin_list.html">Manage</a></nav></div></header>
  <main class="container">
    <h1>Upload Product</h1>
    <form id="product-form" enctype="multipart/form-data">
      <label>SKU / ID<input name="sku" /></label>
      <label>Name<input name="name" required/></label>
      <label>Brand<input name="brand"/></label>
      <label>Collection<input name="collection"/></label>
      <label>Type<input name="type"/></label>
      <label>Gender<input name="gender"/></label>
      <label>Price<input name="price" type="number" step="0.01"/></label>
      <label>Sizes (comma separated)<input name="sizes" /></label>
      <label>Colors (comma separated)<input name="colors" /></label>
      <label>Description<textarea name="description"></textarea></label>
      <label>Primary Image<input type="file" name="image" accept="image/*" /></label>
      <p><button type="submit" class="btn">Create Product</button></p>
    </form>
    <div id="result"></div>
  </main>
  <script>
  document.getElementById('product-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const form = new FormData(e.target);
    const res = await fetch('/api/product', { method:'POST', body: form });
    const j = await res.json();
    if(res.ok) { document.getElementById('result').innerText = 'Created ID: ' + j.id; e.target.reset(); }
    else document.getElementById('result').innerText = JSON.stringify(j);
  });
  </script>
</body>
</html>
